[package]
name = "local-image-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Private, lightweight batch image tools for your desktop"

[[bin]]
name = "local-image-tools"
path = "src/main.rs"

[dependencies]
local-image-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
image.workspace = true
gif.workspace = true
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
directories = "6"
open = "5"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
